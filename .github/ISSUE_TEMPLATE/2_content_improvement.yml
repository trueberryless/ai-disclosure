name: Content improvement
description: Suggest edits to improve clarity, accuracy, or tone.
title: "[Content]: "
labels: ["content"]
body:
  - type: input
    id: section
    attributes:
      label: Section to improve
      description: Which page section should change?
      placeholder: FAQ -> "When do I need to mention AI usage?"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current wording
      description: Paste or summarize the current text.
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording
      description: Provide your proposed replacement.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why this is better
      description: Explain the improvement (clarity, neutrality, precision, etc.).
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Sources (optional)
      description: Add references that support your suggestion.

  - type: textarea
    id: ai-disclosure
    attributes:
      label: AI disclosure
      description: Did AI help draft this suggestion? If yes, briefly describe where/how.
      placeholder: AI helped with phrasing options; I selected and verified the final text.
